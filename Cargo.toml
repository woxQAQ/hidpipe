[workspace]
resolver = "2"
members = ["proto", "server", "client"]
# The client only builds on macOS, the server only on Linux.
# default-members covers what this machine (Linux) can build; use
# `cargo build -p` for the other side's package.
default-members = ["proto", "server"]

[workspace.package]
edition = "2021"
license = "MIT"
