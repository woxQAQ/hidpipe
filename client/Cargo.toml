[package]
name = "hidpipe-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
# Releases held keys on SIGTERM/SIGINT so no keys get stuck at the system
# level.
ctrlc = "3"
# Log timestamps only, pure formatting.
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
hidpipe-proto = { path = "../proto" }
