[package]
name = "hidpipe-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
evdev = "0.12"
# Edge barrier: layer-shell client.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Log timestamps only, pure formatting.
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
# Only used to set the device fd nonblocking (fcntl O_NONBLOCK); evdev
# 0.12 does not expose this. Pinned at 0.23 to match evdev 0.12: newer nix
# fcntl takes AsFd, while evdev 0.12's Device only implements AsRawFd.
nix = "0.23"
hidpipe-proto = { path = "../proto" }